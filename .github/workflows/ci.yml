name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm test:unit
      - run: pnpm build

  web-e2e:
    name: Web end-to-end
    needs: web
    runs-on: ubuntu-latest
    env:
      # Build and serve the production branches of metadata and robots.
      SITE_URL: http://localhost:3000
      VERCEL_ENV: production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=2048
      - name: Start the site
        run: |
          pnpm start > next-start.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl --silent --fail --output /dev/null http://localhost:3000/ && exit 0
            sleep 1
          done
          cat next-start.log
          exit 1
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    name: Lighthouse
    needs: web
    runs-on: ubuntu-latest
    env:
      # Build and serve the production branches of metadata and robots.
      SITE_URL: http://localhost:3000
      VERCEL_ENV: production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=2048
      - name: Start the site
        id: start
        run: |
          pnpm start > next-start.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl --silent --fail --output /dev/null http://localhost:3000/ && exit 0
            sleep 1
          done
          cat next-start.log
          exit 1
      # Scores and timings: three mobile runs per page, asserted on the median.
      # Known gaps warn instead of failing, on the pages they affect only,
      # until their follow-ups land (listed in pull request #148): mobile LCP,
      # performance on /, /my, /about, /my/about, /art-of-wellness and
      # /portfolio, blocking time on / and /my, fonts on /my/about, and
      # accessibility on /book (#56).
      - name: Audit on mobile
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          artifactName: lighthouse-mobile
      # The same assertions with the desktop preset, for the two pages most
      # visitors open on a laptop.
      - name: Audit on desktop
        # Runs even when an earlier audit failed, so one run reports them all.
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.desktop.json
          uploadArtifacts: true
          artifactName: lighthouse-desktop
      # Lighthouse CI asserts either budgets or assertions in one pass, never
      # both, so the byte budgets get their own mobile pass. Byte counts do not
      # vary between runs, so one run per page is enough. Without the opt-out,
      # Lighthouse CI would also load lighthouserc.json's assertions and refuse.
      - name: Check resource budgets
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        uses: treosh/lighthouse-ci-action@v12
        env:
          LHCI_NO_LIGHTHOUSERC: "true"
        with:
          configPath: ./lighthouserc.json
          budgetPath: ./budget.json
          runs: 1
          uploadArtifacts: true
          artifactName: lighthouse-budgets

  commits:
    name: Commit checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check commit messages follow Conventional Commits
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --quiet origin "$BASE_REF"
          pattern='^(feat|fix|perf|refactor|style|docs|chore|test|build|ci|revert)(\([a-z0-9-]+\))?!?: .+'
          status=0
          for sha in $(git rev-list --no-merges "origin/$BASE_REF..HEAD"); do
            subject=$(git log -1 --format=%s "$sha")
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "::error::$(git log -1 --format=%h "$sha"): \"$subject\" should look like \"feat(about): add portrait\"."
              status=1
            fi
          done
          exit $status
