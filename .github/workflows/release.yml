name: Release

# After CI passes on main, build the website image for the live host
# (linux/arm64, natively on an Arm runner), push it to GHCR, then ask the
# host to run it. The host checks /api/health and rolls back on failure.

on:
  workflow_run:
    workflows: [Continuous integration]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/vetmimi/vetmimi-next
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  image:
    name: Build and push the image
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:main
          build-args: |
            SITE_URL=${{ vars.SITE_URL }}
            SITE_ENV=production
          # Optional: without them the pages are built with the written
          # stories only and pick up articles at their next revalidation.
          secrets: |
            api_url=${{ secrets.BUILD_API_URL }}
            api_service_key=${{ secrets.BUILD_API_SERVICE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the live host
    needs: image
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check that a host is configured
        id: host
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -z "$SITE_URL" ]; then
            echo "::error::Set the SITE_URL variable, or the live pages link to localhost"
            exit 1
          elif [ -n "$DEPLOY_HOST" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "::error::DEPLOY_HOST is not set; add it to the production environment"
            exit 1
          else
            echo "::notice::DEPLOY_HOST is not set; skipping deploy"
          fi

      - name: Install the deploy key and pin the host key
        if: steps.host.outputs.configured == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key)
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The key is limited to deploy.sh on the host (a forced command), which
      # pulls the image, swaps it in, and rolls back if it is not healthy.
      - name: Deploy
        if: steps.host.outputs.configured == 'true'
        run: >-
          ssh -i ~/.ssh/deploy_key
          -o BatchMode=yes -o StrictHostKeyChecking=yes
          "deploy@$DEPLOY_HOST" web "$SHA"
