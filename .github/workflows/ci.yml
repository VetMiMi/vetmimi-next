name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm test:unit
      - run: pnpm build

  web-e2e:
    name: Web end-to-end
    needs: web
    runs-on: ubuntu-latest
    env:
      # Build and serve the production branches of metadata and robots.
      SITE_URL: http://localhost:3000
      SITE_ENV: production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=2048
      - name: Start the site
        run: |
          pnpm start > next-start.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl --silent --fail --output /dev/null http://localhost:3000/ && exit 0
            sleep 1
          done
          cat next-start.log
          exit 1
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  dockerfile:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  commits:
    name: Commit checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check commit messages follow Conventional Commits
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --quiet origin "$BASE_REF"
          pattern='^(feat|fix|perf|refactor|style|docs|chore|test|build|ci|revert)(\([a-z0-9-]+\))?!?: .+'
          status=0
          for sha in $(git rev-list --no-merges "origin/$BASE_REF..HEAD"); do
            subject=$(git log -1 --format=%s "$sha")
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "::error::$(git log -1 --format=%h "$sha"): \"$subject\" should look like \"feat(about): add portrait\"."
              status=1
            fi
          done
          exit $status

  lighthouse:
    name: Lighthouse
    needs: web
    runs-on: ubuntu-latest
    env:
      # Build and serve the production branches of metadata and robots.
      SITE_URL: http://localhost:3000
      SITE_ENV: production
      # Log every median, not only the failing ones.
      LHCI_INCLUDE_PASSED_ASSERTIONS: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=2048
      - name: Start the site
        id: start
        run: |
          pnpm start > next-start.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl --silent --fail --output /dev/null http://localhost:3000/ && exit 0
            sleep 1
          done
          cat next-start.log
          exit 1
      - name: Audit on mobile
        uses: treosh/lighthouse-ci-action@12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          artifactName: lighthouse-mobile
      # Temporary, while tuning: what each page loads before its largest paint.
      - name: Show mobile LCP details
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: |
          jq -r -s '
            group_by(.finalDisplayedUrl // .finalUrl)[]
            | sort_by(.audits["largest-contentful-paint"].numericValue)
            | .[(length / 2 | floor)] as $r
            | ($r.audits.metrics.details.items[0]) as $m
            | "== \($r.finalDisplayedUrl // $r.finalUrl): FCP \($m.firstContentfulPaint) LCP \($m.largestContentfulPaint) SI \($m.speedIndex) (observed FCP \($m.observedFirstContentfulPaint) LCP \($m.observedLargestContentfulPaint))",
              "   element: \(($r.audits["largest-contentful-paint-element"].details.items[0].items[0].node.snippet // "-")[0:200])",
              "   phases: \([$r.audits["largest-contentful-paint-element"].details.items[1].items[]? | "\(.phase) \(.timing|floor)"] | join(", "))",
              "   bytes: \([$r.audits["resource-summary"].details.items[] | "\(.resourceType) \(.transferSize) (\(.requestCount))"] | join(", "))",
              ($r.audits["network-requests"].details.items[]
                | select(.transferSize > 1500)
                | "   \(.networkRequestTime|floor)-\(.networkEndTime|floor)ms \(.transferSize) \(.resourceType) \(.priority) \(.url | sub("^http://localhost:3000"; "") | sub("^/_next/image\\?url=%2F_next%2Fstatic%2Fmedia%2F"; "img ") | sub("^/_next/static/"; "") | .[0:110])")
          ' .lighthouseci/lhr-*.json
      # Runs even when the mobile audit fails, so one run reports every page.
      - name: Audit on desktop
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        uses: treosh/lighthouse-ci-action@12.6.2
        with:
          configPath: ./lighthouserc.desktop.json
          uploadArtifacts: true
          artifactName: lighthouse-desktop
      # Budgets and assertions cannot share a pass, so this one ignores
      # lighthouserc.json's assertions. Byte counts barely vary: one run.
      - name: Check byte budgets
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        uses: treosh/lighthouse-ci-action@12.6.2
        env:
          LHCI_NO_LIGHTHOUSERC: "true"
        with:
          configPath: ./lighthouserc.json
          budgetPath: ./budget.json
          runs: 1
          uploadArtifacts: true
          artifactName: lighthouse-budgets
